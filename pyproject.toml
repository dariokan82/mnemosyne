[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-memory"
dynamic = ["version"]
description = "The Universal Memory Layer for Any AI Agent — Zero-Dependency, Sub-Millisecond, Fully Private"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Abdias J", email = "1641797+AxDSan@users.noreply.github.com"},
]
dependencies = [
    "PyYAML>=6.0",
]
keywords = [
    "ai",
    "memory",
    "sqlite",
    "agent",
    "llm",
    "context",
    "embeddings",
    "vector-store",
    "honcho",
    "zep",
    "mcp",
    "openwebui",
    "openclaw",
    "cursor",
    "claude-code",
    "codex",
    "hermes",
    "model-context-protocol",
    "sync",
    "encryption",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
llm = ["ctransformers>=0.2.27", "llama-cpp-python>=0.2.0", "huggingface-hub>=0.20"]
embeddings = ["fastembed>=0.3.0", "sqlite-vec>=0.1.0"]
# mcp 2.x. HISTORY: capped at <2 on 2026-08-05 because mcp 2.0.0 (2026-07-28)
# removed the low-level @server.list_tools() / @server.call_tool() decorators
# this server used, and a floating `mcp>=1.0.0` walked across that major
# boundary on an image rebuild -- the server died at import with
# `AttributeError: 'Server' object has no attribute 'list_tools'`. That note
# said "lift the cap only together with a port to the 2.0 handler API".
# Upstream did exactly that port in v3.15.1 (see mcp_server.py, "Migrated from
# mcp SDK 1.x to 2.x"), so the cap is lifted here. Holding <2 against ported
# code would fail the same way in reverse.
mcp = ["mcp>=2.0.0; python_version >= '3.10'", "anyio>=4.0; python_version >= '3.10'"]
openclaw = ["openclaw>=0.1.0; python_version >= '3.10'"]
sync = ["cryptography>=41.0"]
test = ["pytest>=7.0"]
all = ["ctransformers>=0.2.27", "llama-cpp-python>=0.2.0", "huggingface-hub>=0.20", "fastembed>=0.3.0", "sqlite-vec>=0.1.0", "mcp>=2.0.0; python_version >= '3.10'", "anyio>=4.0; python_version >= '3.10'", "cryptography>=41.0"]
dev = ["pytest>=7.0", "build", "twine", "ruff==0.15.22"]

[project.urls]
Homepage = "https://github.com/AxDSan/mnemosyne"
Repository = "https://github.com/AxDSan/mnemosyne"
Issues = "https://github.com/AxDSan/mnemosyne/issues"
Documentation = "https://github.com/AxDSan/mnemosyne/blob/main/docs/README.md"

[project.scripts]
mnemosyne-install = "mnemosyne.install:install"
mnemosyne-uninstall = "mnemosyne.install:uninstall"
mnemosyne = "mnemosyne.cli:run_cli"
mnemosyne-browser = "mnemosyne.integrations.memory_browser:main"
mnemosyne-auto-save = "mnemosyne.integrations.auto_save_openwebui:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "benchmark*", "_benchmarks*", "scripts*", "docs*", "assets*"]

[tool.setuptools.dynamic]
version = {attr = "mnemosyne.__version__"}
