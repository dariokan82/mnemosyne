# Mnemosyne MCP — Trevor deployment
#
# Matches the mnemo-mcp / port-mcp / paperless-mcp stacks already running
# on this host: build local, bind-mount under /volume1/docker, plain port
# publish (cloudflared runs in network_mode: host and reaches it over
# localhost -- it's the only thing that actually exposes this to the
# internet). Runs alongside the existing mnemo-mcp container/data; nothing
# here touches /volume1/docker/mnemosine.
#
# Set in the stack's environment (Portainer stack env, or a .env file next
# to this compose file if running plain `docker compose`):
#   API_TOKEN  - bearer token clients must send, e.g. `openssl rand -hex 32`
#   MNEMOSYNE_MCP_PUBLIC_URL - externally-reachable https:// origin (e.g.
#                https://mnemosyne.belmont.lol), used by the OAuth PKCE
#                shim's discovery documents and redirects. Only matters
#                once this is exposed non-loopback (it always is here).
#   PUID/PGID  - your Synology account's uid/gid (`id <your-dsm-username>`
#                over SSH). The entrypoint chowns /data to this at every
#                start, same convention as the linuxserver.io syncthing/plex
#                containers already on this host. Defaults to 1000/1000 if
#                unset.
#
# mnemosyne-sleep (2026-07-20): second service, same image, same bind
# mount. Nothing in the MCP server process ever calls `mnemosyne sleep` on
# its own -- confirmed by reading mcp_server.py and entrypoint.sh, no
# scheduler exists anywhere in this image -- so without this, working
# memory accumulates forever and episodic promotion / tiered degradation
# never run. This service runs entrypoint.sh's sleep-loop mode instead of
# starting the MCP server. MNEMOSYNE_SLEEP_INTERVAL_SECONDS controls the
# interval (default 21600 = 6h). Safe to run alongside mnemosyne-mcp:
# WAL mode + busy_timeout are already on for the sqlite connection.

services:
  mnemosyne-mcp:
    build: .
    container_name: mnemosyne-mcp
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - /volume1/docker/mnemosyne:/data
    environment:
      - MNEMOSYNE_DATA_DIR=/data
      - MNEMOSYNE_VEC_TYPE=int8
      # LLM disabled here on purpose (2026-08-05). This service has no
      # ANTHROPIC_API_KEY and no MNEMOSYNE_LLM_BASE_URL, so with this set
      # to true, mnemosyne_remember(extract=True) walked the fallback
      # ladder down to the local GGUF rung -- the same local model the
      # sleep service below deliberately avoids as "unusably slow" -- and
      # tried to DOWNLOAD it from HuggingFace at request time. That was
      # this container's first ever outbound TLS connection (embeddings
      # and sqlite are both local, entity extraction is pure regex), and
      # OpenSSL's RNDGETENTCNT check found the Synology entropy pool too
      # thin and BLOCKED rather than erroring -- holding the sqlite lock
      # and taking both containers unhealthy until a redeploy. With this
      # false, extract=True degrades to the keyword path instead of
      # hanging. LLM summarization still happens, in mnemosyne-sleep,
      # via the Anthropic API. Do not set this true without also giving
      # this service a real endpoint.
      - MNEMOSYNE_LLM_ENABLED=false
      # `:?` on purpose (2026-08-05). An unset API_TOKEN used to substitute
      # empty, which the S1 guard in mcp_server.py correctly refuses to bind
      # with -- but the refusal surfaced only as a RuntimeError buried under
      # a restart loop (97 restarts before anyone read the log). With `:?`,
      # compose refuses at deploy time and names the missing variable in the
      # Portainer error banner instead.
      - MNEMOSYNE_MCP_TOKEN=${API_TOKEN:?API_TOKEN must be set in the Portainer stack env}
      - MNEMOSYNE_MCP_PUBLIC_URL=${MNEMOSYNE_MCP_PUBLIC_URL:-}
      # Keep this true: it is the regex entity extractor, not the LLM one.
      # No network, no model -- it writes the annotations that feed recall's
      # fact bonus (3.8k rows and counting).
      - MNEMOSYNE_DEFAULT_EXTRACT_ENTITIES=true
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8181"]
    # Overrides the image's HEALTHCHECK (2026-09-16). Upstream's probe is
    # `python -c "from mnemosyne import recall; recall('health', top_k=1)"`
    # with a 5s timeout: a cold interpreter plus the embedding model, which
    # cannot finish in five seconds on this host. It had failed 17,862 times
    # in a row -- roughly one cold model load every 34 seconds for a week,
    # on a 2-core 2013 CPU, with the result thrown away every time.
    # This probe answers the only question a container probe can: is the
    # server listening? No import, no model, no disk.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.create_connection(('127.0.0.1',8181),3); s.close()"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  mnemosyne-sleep:
    build: .
    container_name: mnemosyne-sleep
    restart: unless-stopped
    volumes:
      - /volume1/docker/mnemosyne:/data
    environment:
      - MNEMOSYNE_DATA_DIR=/data
      - MNEMOSYNE_SLEEP_INTERVAL_SECONDS=21600
      # Explicit, not inherited from the default (2026-08-05). This is the
      # master gate at local_llm.py:23, and _host_backend_will_handle_call()
      # at :301 requires LLM_ENABLED *and* HOST_LLM_ENABLED both true before
      # the Anthropic/Opus path is even considered. Flip this to false here
      # and Claude summarization stops silently -- no error, no log line, it
      # just walks down to the local GGUF. The mcp service above sets false
      # for its own reasons; this service must not inherit that.
      - MNEMOSYNE_LLM_ENABLED=true
      # With a key set, consolidation summarizes via the Anthropic API
      # instead of the local GGUF, which is unusably slow on this host.
      # Leave ANTHROPIC_API_KEY unset in the stack env to fall back to the
      # local model -- the entrypoint picks based on its presence.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MNEMOSYNE_HOST_LLM_MODEL=${MNEMOSYNE_HOST_LLM_MODEL:-claude-opus-5}
      - MNEMOSYNE_HOST_LLM_TIMEOUT=${MNEMOSYNE_HOST_LLM_TIMEOUT:-120}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    command: ["sleep-loop"]
    # Disabled rather than replaced (2026-09-16). This service has no port and
    # no cheap liveness signal -- its real health is "did consolidation run six
    # hours ago", which no container probe can see. Inheriting the image's
    # model-loading check just painted it permanently red, and a light that can
    # never go green is worse than no light: it teaches you to ignore lights.
    healthcheck:
      disable: true
